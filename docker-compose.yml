services:
  lifepi:
    build: .
    image: ghcr.io/therealshadoh/lifepi-web:latest
    ports:
      - "${LIFEPI_PORT:-8080}:8080"   # host port; e.g. LIFEPI_PORT=8090 if 8080 is taken
      - "${LIFEPI_COMPANION_PORT:-8765}:8765"   # phones + TV view on your network
    environment:
      RESOLUTION: ${RESOLUTION:-1280x720}   # 800x480 mimics the official 7" Pi touchscreen
      ROTATE: ${ROTATE:-}                   # start rotated: 90 / 180 / 270
      VNC_PASSWORD: ${VNC_PASSWORD:-}       # set this if the port is reachable by others
      # address phones should use, e.g. http://192.168.1.20:8765 (a container can't see the host's IP)
      LIFEPI_PUBLIC_URL: ${LIFEPI_PUBLIC_URL:-}
    volumes:
      - lifepi-data:/data      # saved game, profiles, cached card art, local images
    restart: unless-stopped
volumes:
  lifepi-data:
