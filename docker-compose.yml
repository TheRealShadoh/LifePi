services:
  lifepi:
    build: .
    image: ghcr.io/therealshadoh/lifepi-web:latest
    ports:
      - "8080:8080"
    environment:
      RESOLUTION: 1280x720     # try 800x480 to mimic the official 7" Pi touchscreen
      # ROTATE: 90             # start rotated (0/90/180/270)
      # VNC_PASSWORD: changeme # set this if the port is reachable by others
    volumes:
      - lifepi-data:/data      # saved game, profiles, cached card art, local images
    restart: unless-stopped
volumes:
  lifepi-data:
