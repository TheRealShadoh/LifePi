name: CI

# Every push and PR - and, via workflow_call, every release (release.yml): a tag is only
# released when all of these jobs pass.
on:
  push:
    branches: ["**"]        # tags go through release.yml, which runs this workflow first
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]   # arm64 = same architecture as a 64-bit Pi
        python: ["3.11", "3.13"]               # 3.11 = Pi OS Bookworm, 3.13 = Trixie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pygame
      - run: python -m py_compile lifepi.py
      - name: Headless smoke test
        env:
          SDL_VIDEODRIVER: dummy
          LIFEPI_SHOTS: ${{ runner.temp }}/shots
        run: python tests/smoke_test.py
      - name: Phones / TV companion server
        env:
          SDL_VIDEODRIVER: dummy
          LIFEPI_SHOTS: ${{ runner.temp }}/shots
        run: pip install qrcode && python tests/companion_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/shots/*.png

  distro-pygame:
    name: apt python3-pygame on arm64 (what install.sh uses)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pygame python3-qrcode
      - env:
          SDL_VIDEODRIVER: dummy
        run: /usr/bin/python3 tests/smoke_test.py && /usr/bin/python3 tests/companion_test.py

  web:
    name: phone / browser build (pygbag + headless Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3 pygame-ce websocket-client
      - name: Build the installable web app
        env:
          SDL_VIDEODRIVER: dummy
        run: python web/build.py
      - name: End-to-end test in headless Chrome (phone size, real touch input)
        env:
          LIFEPI_SHOTS: ${{ runner.temp }}/web-shots
        run: |
          # pygbag's runtime comes from its CDN: retry once before calling it a failure
          python tests/web_test.py || { echo "retrying once"; sleep 20; python tests/web_test.py; }
      - name: Phone page (QR code) end to end - busy table, commander damage, force landscape
        env:
          SDL_VIDEODRIVER: dummy
          LIFEPI_SHOTS: ${{ runner.temp }}/web-shots
        run: python tests/phone_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-web
          path: ${{ runner.temp }}/web-shots/*.png
      - uses: actions/upload-artifact@v4       # the exact files that were tested; releases ship these
        with:
          name: lifepi-web
          path: build/web
          include-hidden-files: true

  scryfall-live:
    name: live Scryfall search (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true                    # a Scryfall outage must not fail the build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pygame
      - env:
          SDL_VIDEODRIVER: dummy
          LIFEPI_SHOTS: ${{ runner.temp }}/shots
        run: python tests/live_scryfall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-scryfall-live
          path: ${{ runner.temp }}/shots/*.png
