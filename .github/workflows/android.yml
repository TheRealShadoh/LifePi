name: Android app

# Builds LifePi for Google Play (mobile/) and tests the real APK in an emulator.
# Secrets (Settings > Secrets and variables > Actions), all optional:
#   LIFEPI_UPLOAD_KEYSTORE_B64, LIFEPI_UPLOAD_STORE_PASSWORD  - signs the Play bundle (upload key)
#   ADMOB_APP_ID, ADMOB_BANNER_ID                             - real ads (else Google's sample ads)
# A version tag (v1.15.0) also uploads the tested bundle to Google Play closed testing. That needs
# no secret: Workload Identity Federation (see the play job) - only this repo's v* tags can sign in.
# The signed bundle is also the "lifepi-play-bundle" artifact of every run.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["lifepi.py", "web/**", "mobile/**", "tests/web_test.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["lifepi.py", "web/**", "mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (web app + bundled runtime + Capacitor + Gradle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install pygbag==0.9.3 pygame-ce websocket-client
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.LIFEPI_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "LIFEPI_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
            echo "signing with the upload key"
          else
            echo "::warning::no LIFEPI_UPLOAD_KEYSTORE_B64 secret - the release bundle is unsigned (can't go to Play)"
          fi
      - name: Build
        env:
          SDL_VIDEODRIVER: dummy
          LIFEPI_UPLOAD_STORE_PASSWORD: ${{ secrets.LIFEPI_UPLOAD_STORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          # pygbag's runtime comes from its CDN: retry once before failing. On failure the log's
          # tail also goes into an annotation, readable without downloading the log.
          set -o pipefail
          ok=0
          for try in 1 2; do
            mobile/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log" && { ok=1; break; }
            echo "attempt $try failed"; sleep 20
          done
          if [ "$ok" != 1 ]; then
            grep -E "error|Error|FAIL|What went wrong|^e: |\.java:[0-9]+|Traceback|assert" "$RUNNER_TEMP/build.log" | tail -40 > "$RUNNER_TEMP/err.txt" || true
            tail -40 "$RUNNER_TEMP/build.log" >> "$RUNNER_TEMP/err.txt"
            echo "::error title=build failed::$(sed 's/%/%25/g' "$RUNNER_TEMP/err.txt" | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-30000)"
            exit 1
          fi
      - name: What's bundled
        run: |
          du -sh mobile/android/app/src/main/assets/cdn
          ls -la mobile/android/app/build/outputs/bundle/release/ mobile/android/app/build/outputs/apk/*/
      - uses: actions/upload-artifact@v4
        with:
          name: lifepi-play-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: lifepi-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk

  emulator:
    name: emulator test (offline start, menu-only banner, Back)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # screenshots to the ci-shots branch (artifacts aren't reachable everywhere)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - uses: actions/download-artifact@v4
        with:
          name: lifepi-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LIFEPI_SHOTS: ${{ runner.temp }}/android-shots
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python mobile/emulator_test.py "$(find apk -name '*debug*.apk' | head -1)" > "$RUNNER_TEMP/emu.log" 2>&1 || { cat "$RUNNER_TEMP/emu.log"; echo "::error title=emulator test failed::$(tail -110 "$RUNNER_TEMP/emu.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-30000)"; exit 1; }
      - name: Screenshots to the ci-shots branch
        if: always() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/android-shots" 2>/dev/null && ls *.png >/dev/null 2>&1 || exit 0
          git init -q -b ci-shots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Android screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: ${{ runner.temp }}/android-shots/*.png

  play:
    name: upload to Google Play (closed testing)
    # only for version tags, and only once the bundle built and the emulator test passed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write          # Workload Identity Federation: GitHub vouches for this run to Google
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: lifepi-play-bundle
          path: bundle
      - name: Play hold?
        id: hold
        run: |
          # a .play-hold file in the repo pauses uploads (e.g. while Google reviews the first release);
          # everything else about the release still happens
          if [ -f .play-hold ]; then
            echo "::notice title=Not uploaded to Play::.play-hold is in the repo: $(head -1 .play-hold)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the bundle is releasable
        if: steps.hold.outputs.skip != '1'
        env:
          HAS_KEYSTORE: ${{ secrets.LIFEPI_UPLOAD_KEYSTORE_B64 != '' }}
          HAS_ADMOB: ${{ secrets.ADMOB_APP_ID != '' && secrets.ADMOB_BANNER_ID != '' }}
        run: |
          # never send Play a bundle that is unsigned or carries Google's test ads
          [ "$HAS_KEYSTORE" = "true" ] || { echo "::error::no LIFEPI_UPLOAD_KEYSTORE_B64 secret - the bundle is unsigned"; exit 1; }
          [ "$HAS_ADMOB" = "true" ] || { echo "::error::no ADMOB_APP_ID / ADMOB_BANNER_ID secrets - the bundle would show test ads"; exit 1; }
      # No key anywhere: Google trusts GitHub's token for this repo's version tags only (Google Cloud
      # project lifepi-play, pool "github", provider "lifepi-repo"), and lets it act as the service
      # account below, which Play Console allows to release LifePi to testing tracks and nothing else.
      - uses: google-github-actions/auth@v2
        if: steps.hold.outputs.skip != '1'
        with:
          workload_identity_provider: projects/1067872504029/locations/global/workloadIdentityPools/github/providers/lifepi-repo
          service_account: lifepi-play-release@lifepi-play.iam.gserviceaccount.com
      - name: Upload to the closed testing track
        if: steps.hold.outputs.skip != '1'
        env:
          LIFEPI_PLAY_ACCOUNT: lifepi-play-release@lifepi-play.iam.gserviceaccount.com
        run: |
          pip install -q google-auth requests
          aab=$(find bundle -name '*.aab' | head -1)
          python scripts/play_upload.py "$aab" --track alpha --federated 2>&1 | tee "$RUNNER_TEMP/play.log" || {
            echo "::error title=Play upload failed::$(tail -20 "$RUNNER_TEMP/play.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1; }
          echo "::notice title=On Google Play::$(grep -E 'version .* track' "$RUNNER_TEMP/play.log" | tail -1)"
